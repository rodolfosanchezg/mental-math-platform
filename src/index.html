<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mental Math</title>
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main>
    <h1>MENTAL MATH</h1>
    <section id="login-screen" aria-label="Inicio de sesión">
      <form id="login-form" method="post" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none"
               spellcheck="false" minlength="3" maxlength="24" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-submit" type="submit">INICIAR SESIÓN</button>
      </form>
    </section>
    <section id="home-screen" aria-label="Sesión autenticada" hidden>
      <section data-screen="home" hidden>
        <h2 id="greeting" tabindex="-1"></h2>
        <p>Sumas: <strong id="addition-level"></strong></p>
        <button id="addition" type="button">SUMAS</button>
        <p>Multiplicaciones: <strong id="multiplication-level"></strong></p>
        <button id="multiplication" type="button">MULTIPLICACIONES</button>
        <button id="view-records" type="button">VER RECORDS</button>
      </section>
      <section data-screen="pre-game" hidden>
        <h2 id="mode-title" tabindex="-1"></h2>
        <p>Nivel <strong id="mode-level"></strong></p>
        <button id="start" type="button" disabled>START</button>
        <button data-home type="button">HOME</button>
      </section>
      <section data-screen="records" hidden>
        <h2 tabindex="-1">Records personales</h2>
        <div id="records-list"></div>
        <p id="records-status" role="status"></p>
        <button id="records-retry" type="button" hidden>REINTENTAR</button>
        <button data-home type="button">HOME</button>
      </section>
      <section data-screen="results" hidden>
        <h2 tabindex="-1">TIEMPO TERMINADO</h2>
        <dl class="totals">
          <dt>Operaciones</dt><dd id="result-total"></dd>
          <dt>Correctas</dt><dd id="result-correct"></dd>
          <dt>Incorrectas</dt><dd id="result-incorrect"></dd>
          <dt>Precisión</dt><dd id="result-accuracy"></dd>
        </dl>
        <p id="level-message" role="status"></p>
        <button id="result-refresh" type="button" hidden>REINTENTAR ACTUALIZACIÓN</button>
        <button id="play-again" type="button">OTRO JUEGO</button>
        <button id="switch-mode" type="button">CAMBIAR A MULTIPLICACIONES</button>
        <button id="review-errors" type="button">REVISAR ERRORES</button>
        <button id="results-records" type="button">VER RECORDS</button>
        <button id="results-home" data-home type="button">HOME</button>
      </section>
      <section data-screen="errors" hidden>
        <h2 tabindex="-1">Revisar errores</h2>
        <ul id="error-list"></ul>
        <p id="errors-status" role="status"></p>
        <button id="back-results" type="button">RESULTADOS</button>
      </section>
      <section data-screen="game" hidden>
        <span id="timer" aria-label="Segundos restantes">45</span>
        <h2 class="sr-only" tabindex="-1">Partida</h2>
        <div id="operation"></div>
        <div id="answer" aria-label="Respuesta"></div>
        <div id="feedback" aria-live="polite"></div>
        <p id="game-status" role="status"></p>
        <button id="save-retry" type="button" hidden>REINTENTAR</button>
        <button id="game-home" data-home type="button" hidden>HOME</button>
      </section>
      <button id="logout" type="button">LOGOUT</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript>Activa JavaScript para iniciar sesión.</noscript>
  </main>
</body>
</html>

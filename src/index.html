<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mental Math</title>
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main>
    <h1>MENTAL MATH</h1>
    <section id="login-screen" aria-label="Inicio de sesión">
      <form id="login-form" method="post" novalidate>
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none"
               spellcheck="false" minlength="3" maxlength="24" required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-submit" type="submit">INICIAR SESIÓN</button>
      </form>
    </section>
    <section id="home-screen" aria-label="Sesión autenticada" hidden>
      <h2>Sesión iniciada</h2>
      <button id="logout" type="button">LOGOUT</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript>Activa JavaScript para iniciar sesión.</noscript>
  </main>
</body>
</html>
